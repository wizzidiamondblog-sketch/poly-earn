<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Earn - Verify Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6 text-center">
        <div class="space-y-2">
            <h1 class="text-3xl font-extrabold text-indigo-400 tracking-wide">Verify Email</h1>
            <p class="text-sm text-slate-400">Enter the 6-digit confirmation code sent to your Gmail inbox.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="bg-red-500/10 border border-red-500 text-red-400 p-3 rounded-xl text-center text-sm font-medium">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/verify" method="POST" class="space-y-4">
            <div>
                <input type="text" name="code" required placeholder="Enter 6-digit code" maxlength="6" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl tracking-widest text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200">
                Verify & Login
            </button>
        </form>
    </div>
</body>
</html>
