<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Earn - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-indigo-400 tracking-wide">Recover Password</h1>
            <p class="text-sm text-slate-400">Enter your email to receive a reset code</p>
        </div>
        <form action="/forgot-password" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">EMAIL ADDRESS</label>
                <input type="email" name="email" required placeholder="Enter your registered email" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                Send Reset Code
            </button>
        </form>
        <p class="text-xs text-center text-slate-400">
            Remembered your password? <a href="/login" class="text-indigo-400 font-bold hover:underline">Login here</a>
        </p>
    </div>
</body>
</html>
