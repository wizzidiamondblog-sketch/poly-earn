<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Earn - Create New Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-6 space-y-6">

        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-emerald-400">
                Create New Password
            </h1>
            <p class="text-sm text-slate-400">
                Enter and confirm your new password below.
            </p>
        </div>

        <form action="/reset-password" method="POST" class="space-y-4">

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">
                    REGISTERED EMAIL
                </label>
                <input
                    type="email"
                    name="email"
                    required
                    autocomplete="email"
                    placeholder="Enter your registered email"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">
                    NEW PASSWORD
                </label>
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-2">
                    CONFIRM NEW PASSWORD
                </label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter the password again"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <p id="password_error" class="hidden text-sm text-red-400">
                The passwords do not match.
            </p>

            <button
                type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition">
                Save New Password
            </button>
        </form>

        <p class="text-xs text-center text-slate-400">
            Remembered your password?
            <a href="/login" class="text-emerald-400 font-bold hover:underline">
                Login here
            </a>
        </p>
    </div>

    <script>
        const form = document.querySelector("form");
        const password = document.getElementById("new_password");
        const confirmPassword = document.getElementById("confirm_password");
        const error = document.getElementById("password_error");

        form.addEventListener("submit", function(event) {
            if (password.value !== confirmPassword.value) {
                event.preventDefault();
                error.classList.remove("hidden");
                confirmPassword.focus();
            } else {
                error.classList.add("hidden");
            }
        });
    </script>
</body>
</html>
