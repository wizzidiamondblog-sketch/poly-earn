<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Poly Earn - Watch Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-white min-h-screen flex flex-col overflow-hidden select-none">

  <!-- Floating Fixed Top Header: Back Button & Live Timer -->
  <div class="h-[60px] bg-[#151922] border-b border-slate-800 px-4 flex items-center justify-between shadow-xl z-50">
    <a href="/dashboard" class="w-9 h-9 bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center text-white font-bold text-sm hover:bg-slate-700 transition">
      ✕
    </a>

    <!-- Active Timer Badge -->
    <div id="timer-badge-container" class="flex items-center space-x-2 bg-purple-600/20 border border-purple-500/40 px-3.5 py-1.5 rounded-full">
      <span class="w-2.5 h-2.5 bg-amber-400 rounded-full animate-ping"></span>
      <span class="text-xs font-bold text-slate-300">Reward in:</span>
      <span class="text-sm font-black text-amber-400 tracking-wider" id="countdown">20s</span>
    </div>

    <!-- Claim Button Container (Hidden until 20s reaches 0s) -->
    <form id="claim-form" action="/claim-reward" method="POST" class="hidden">
      <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition-all animate-bounce">
        Claim +100 Points 🎉
      </button>
    </form>
  </div>

  <!-- Full Screen Live Ad Container -->
  <div class="w-full flex-1 relative bg-slate-950" style="height: calc(100vh - 60px);">
    <iframe src="https://uplcm.com/4/12063392" class="w-full h-full border-0" scrolling="yes"></iframe>
  </div>

  <script>
    let timeLeft = 20;
    const countdownEl = document.getElementById('countdown');
    const timerBadgeContainer = document.getElementById('timer-badge-container');
    const claimForm = document.getElementById('claim-form');

    const downloadTimer = setInterval(function() {
      timeLeft--;
      countdownEl.innerText = timeLeft + "s";
      
      if (timeLeft <= 0) {
        clearInterval(downloadTimer);
        timerBadgeContainer.classList.add('hidden');
        claimForm.classList.remove('hidden');
      }
    }, 1000);
  </script>

</body>
</html>
