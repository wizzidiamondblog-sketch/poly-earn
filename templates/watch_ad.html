
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly Earn - Watch Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0e14] text-white min-h-screen flex flex-col justify-between p-6 select-none">

  <!-- Top Navigation -->
  <div class="max-w-md w-full mx-auto flex justify-between items-center">
    <a href="/dashboard"
       class="w-10 h-10 bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center text-white font-bold text-lg hover:bg-slate-700 transition">
      ✕
    </a>

    <span id="countdown-badge"
          class="text-sm font-black tracking-wider bg-purple-600/20 border border-purple-500/40 text-purple-300 px-4 py-1.5 rounded-full backdrop-blur shadow-md">
      00:30
    </span>
  </div>

  <!-- Main Card -->
  <div class="max-w-md w-full mx-auto bg-[#151922] border border-slate-800 rounded-3xl p-6 text-center space-y-6 shadow-2xl my-auto">

    <div class="w-20 h-20 bg-gradient-to-tr from-purple-600 to-indigo-500 rounded-3xl flex items-center justify-center mx-auto text-white text-3xl shadow-lg shadow-purple-600/30 animate-pulse">
      ⚡
    </div>

    <div class="space-y-2">
      <h2 id="status-heading" class="text-xl font-black text-white">
        Ad In Progress...
      </h2>

      <p id="status-text" class="text-xs text-slate-400">
        Your ad is opening. Please wait 30 seconds.
      </p>
    </div>

    <!-- Countdown -->
    <div id="timer-box" class="py-2">
      <div id="countdown"
           class="text-5xl font-black text-amber-400 tracking-wider">
        30
      </div>

      <p class="text-xs text-slate-500 mt-2">
        Seconds remaining...
      </p>
    </div>

    <!-- Crediting Status -->
    <div id="crediting-box" class="hidden py-4 space-y-2">
      <div class="inline-block w-8 h-8 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>

      <p class="text-sm font-bold text-emerald-400">
        Processing your reward...
      </p>
    </div>

    <!-- Existing Claim Form -->
    <form id="auto-claim-form"
          action="/claim-reward"
          method="POST"
          class="hidden">
    </form>

  </div>

  <div class="max-w-md w-full mx-auto text-center text-xs text-slate-600 pb-2">
    Poly Earn &copy; 2026.
  </div>

  <script>
    const AD_URL = "https://uplcm.com/4/12063392";

    let timeLeft = 30;

    const countdownEl = document.getElementById("countdown");
    const badge = document.getElementById("countdown-badge");

    // Automatically attempt to open the Monetag link.
    // Browser settings may block automatic pop-ups.
    window.addEventListener("load", function () {
      window.open(AD_URL, "_blank");
    });

    // 30-second countdown
    const downloadTimer = setInterval(function () {
      timeLeft = Math.max(timeLeft - 1, 0);

      countdownEl.innerText = timeLeft;

      const secs = timeLeft < 10 ? "0" + timeLeft : timeLeft;
      badge.innerText = "00:" + secs;

      if (timeLeft === 0) {
        clearInterval(downloadTimer);

        document.getElementById("timer-box").classList.add("hidden");
        document.getElementById("crediting-box").classList.remove("hidden");

        document.getElementById("status-heading").innerText =
          "Processing Reward...";

        document.getElementById("status-text").innerText =
          "Updating your points balance.";

        badge.classList.replace(
          "bg-purple-600/20",
          "bg-emerald-600/20"
        );

        badge.classList.replace(
          "text-purple-300",
          "text-emerald-400"
        );

        badge.innerText = "DONE!";

        setTimeout(function () {
          document.getElementById("auto-claim-form").submit();
        }, 500);
      }
    }, 1000);
  </script>

</body>
</html>
