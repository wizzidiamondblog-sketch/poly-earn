<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly Earn - Watch Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#c8e6c9] text-slate-900 min-h-screen flex flex-col justify-between p-4 select-none relative">

  <!-- Top Bar: Back & Countdown Timer -->
  <div class="max-w-md w-full mx-auto flex justify-between items-center z-20">
    <a href="/dashboard" class="w-10 h-10 bg-black/20 rounded-full flex items-center justify-center text-white font-bold text-lg hover:bg-black/30 transition">
      ✕
    </a>
    <span class="text-sm font-black tracking-wider bg-black/30 text-white px-4 py-1.5 rounded-full backdrop-blur shadow-md" id="countdown-badge">
      00:20
    </span>
  </div>

  <!-- Ad Box & Content Container -->
  <div class="max-w-md w-full mx-auto my-auto space-y-4 z-10">
    
    <!-- Ad Card (Monetag Style) -->
    <div class="bg-white rounded-3xl p-5 shadow-2xl border border-slate-200 space-y-4">
      <div class="rounded-2xl overflow-hidden bg-slate-900 shadow-inner relative aspect-video flex items-center justify-center">
        <!-- Mock Ad Image/Banner -->
        <div class="absolute inset-0 bg-gradient-to-tr from-slate-900 via-slate-800 to-indigo-950 flex flex-col items-center justify-center p-6 text-center">
          <span class="text-4xl mb-2">🎁</span>
          <h3 class="text-white font-bold text-lg">Win 100 USDT Weekly</h3>
          <p class="text-slate-300 text-xs mt-1">Free entry, no deposits, no risk. Finish first and take the full prize.</p>
        </div>
        <span class="absolute bottom-2 right-2 text-[10px] text-slate-400 bg-black/50 px-2 py-0.5 rounded font-bold">Ad</span>
      </div>

      <div class="text-center pt-1">
        <p class="text-[11px] text-slate-500 font-medium">ads by Monetag</p>
      </div>
    </div>

    <!-- Click to get reward instruction box (Hidden during countdown, shows after 20s) -->
    <div id="instruction-box" class="hidden transform transition-all duration-300">
      <div class="bg-[#1b4332] text-white p-3.5 rounded-2xl text-center shadow-lg border border-emerald-500/40 relative">
        <div class="absolute -top-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-[#1b4332] rotate-45 border-t border-l border-emerald-500/40"></div>
        <p class="font-bold text-sm flex items-center justify-center space-x-2">
          <span>⬇️ Click the ad below to unlock reward!</span>
        </p>
      </div>
    </div>

  </div>

  <!-- Bottom Action Section -->
  <div class="max-w-md w-full mx-auto space-y-3 z-25 pb-2">
    <!-- Ad Link Button -->
    <a id="ad-link-btn" href="https://uplcm.com/4/12063392" target="_blank" onclick="unlockReward()" class="block w-full py-4 bg-sky-500 hover:bg-sky-400 text-white text-center font-black rounded-2xl shadow-xl transition-all text-base tracking-wide pointer-events-none opacity-60">
      Wait for timer...
    </a>

    <!-- Claim Reward Form (Hidden until user clicks ad) -->
    <form id="claim-form" action="/claim-reward" method="POST" class="hidden">
      <button type="submit" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-2xl shadow-xl transition-all text-base tracking-wide flex items-center justify-center space-x-2">
        <span>Continue & Claim +10 XP 🎉</span>
      </button>
    </form>
  </div>

  <script>
    let timeLeft = 20;
    const countdownBadge = document.getElementById('countdown-badge');
    const adLinkBtn = document.getElementById('ad-link-btn');
    const instructionBox = document.getElementById('instruction-box');

    const timer = setInterval(function() {
      timeLeft--;
      let seconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
      countdownBadge.innerText = "00:" + seconds;

      if (timeLeft <= 0) {
        clearInterval(timer);
        countdownBadge.innerText = "00:00";
        countdownBadge.classList.replace('bg-black/30', 'bg-emerald-600');
        
        // Enable Ad Link & Show Instruction
        adLinkBtn.classList.remove('pointer-events-none', 'opacity-60');
        adLinkBtn.classList.replace('bg-sky-500', 'bg-indigo-600');
        adLinkBtn.innerText = "👉 Click This Ad Link To Continue";
        
        instructionBox.classList.remove('hidden');
      }
    }, 1000);

    function unlockReward() {
      // Once user clicks the ad link, show the final claim form button
      setTimeout(() => {
        adLinkBtn.style.display = 'none';
        document.getElementById('claim-form').classList.remove('hidden');
      }, 1500);
    }
  </script>

</body>
</html>
