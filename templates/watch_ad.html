<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Ad & Earn - Poly Earn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl text-center">
    
    <!-- Header -->
    <h1 class="text-xl font-bold mb-4">Watch Ad to Claim Reward</h1>

    <!-- Green Pill Countdown Badge -->
    <div class="mb-4">
      <span id="ad-timer" class="bg-emerald-500/20 text-emerald-400 font-bold px-5 py-2 rounded-full text-base inline-block border border-emerald-500/30 tracking-wider">
        00:20
      </span>
    </div>

    <!-- Ad Container Card -->
    <div class="my-4 p-6 bg-slate-950 rounded-2xl border border-slate-800 min-h-[220px] flex items-center justify-center">
      <!-- Monetag / Ad Code Script Goes Here -->
      <p class="text-slate-400 text-sm">Ad Content Loading...</p>
    </div>

    <!-- Monetag Label -->
    <div class="mb-4">
      <span class="text-xs text-slate-500 bg-slate-800/60 px-3 py-1 rounded-full">ads by Monetag</span>
    </div>

    <!-- Continue / Claim Reward Button -->
    <form action="/claim-reward" method="POST">
      <button id="claim-btn" type="submit" disabled class="w-full py-4 bg-slate-800 text-slate-500 font-bold rounded-2xl text-base cursor-not-allowed transition-all">
        Please wait (20s)...
      </button>
    </form>

  </div>

  <script>
    let timeLeft = 20;
    const timerElement = document.getElementById('ad-timer');
    const claimBtn = document.getElementById('claim-btn');

    const countdown = setInterval(() => {
      timeLeft--;
      let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
      timerElement.innerText = `00:${seconds}`;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        timerElement.innerText = "00:00";
        
        // Unlock Button
        claimBtn.disabled = false;
        claimBtn.innerText = "Continue & Claim Reward";
        claimBtn.className = "w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl text-base cursor-pointer transition-all shadow-lg shadow-blue-600/30";
      }
    }, 1000);
  </script>

</body>
</html>
