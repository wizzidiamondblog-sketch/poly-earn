
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly Earn - Watch Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0e14] text-white min-h-screen flex items-center justify-center p-5">

  <main class="w-full max-w-lg rounded-3xl border border-slate-800 bg-[#151922] p-6 text-center">
    <div class="text-6xl mb-5">⚡</div>

    <h1 class="text-2xl font-bold mb-3">Watch Advertisement</h1>

    <p class="text-slate-400 mb-6">
      Tap the button below to open the advert. Keep this page open while the countdown runs.
    </p>

    <div id="timer"
      class="inline-block rounded-full bg-purple-950 border border-purple-600 px-8 py-4 text-2xl font-bold text-purple-300 mb-6">
      00:30
    </div>

    <p id="status" class="text-slate-300 mb-5">
      Tap the button to start watching.
    </p>

    <p id="error" class="hidden text-red-400 mb-5"></p>

    <button id="startBtn" type="button"
      class="w-full rounded-xl bg-purple-600 py-4 font-bold text-white">
      Open Advertisement
    </button>

    <button id="retry" type="button"
      class="hidden w-full rounded-xl bg-slate-700 py-4 font-bold text-white mt-3">
      Try Again
    </button>

    <p class="text-xs text-slate-500 mt-6">
      Reward: 3 Poly Points after a successful claim.
    </p>
  </main>

  <script>
    const AD_URL = "https://uplcm.com/4/12091992";

    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const startBtn = document.getElementById("startBtn");
    const retryBtn = document.getElementById("retry");

    let started = false;
    let countdownInterval = null;

    function showError(message) {
      clearInterval(countdownInterval);
      started = false;

      timerEl.textContent = "00:30";
      statusEl.textContent = "Could not start the reward session.";
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");

      startBtn.classList.remove("hidden");
      retryBtn.classList.remove("hidden");
    }

    async function startWatching() {
      if (started) return;
      started = true;

      errorEl.classList.add("hidden");
      startBtn.disabled = true;
      startBtn.classList.add("opacity-50");
      retryBtn.classList.add("hidden");
      statusEl.textContent = "Authorizing your reward session...";

      // Open the advert immediately during the button tap.
      // This helps prevent mobile browsers from blocking the popup.
      const adWindow = window.open(AD_URL, "_blank");

      if (!adWindow) {
        started = false;
        startBtn.disabled = false;
        startBtn.classList.remove("opacity-50");

        showError("Your browser blocked the advert. Allow pop-ups, then tap Try Again.");
        return;
      }

      try {
        const response = await fetch("/start-ad", {
          method: "POST",
          headers: {
            "Accept": "application/json"
          },
          credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          try {
            adWindow.close();
          } catch (e) {}

          throw new Error(
            data.message || "The server could not authorize this session."
          );
        }

        let remaining = 30;
        timerEl.textContent = "00:30";
        statusEl.textContent =
          "Advert opened. Keep this page open until the timer finishes.";

        startBtn.classList.add("hidden");

        countdownInterval = setInterval(() => {
          remaining--;

          timerEl.textContent =
            "00:" + String(remaining).padStart(2, "0");

          if (remaining <= 0) {
            clearInterval(countdownInterval);
            statusEl.textContent = "Time complete. Submitting reward claim...";

            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/claim-reward";

            document.body.appendChild(form);
            form.submit();
          }
        }, 1000);

      } catch (error) {
        showError(error.message || "Unable to start. Please try again.");
      } finally {
        startBtn.disabled = false;
        startBtn.classList.remove("opacity-50");
      }
    }

    startBtn.addEventListener("click", startWatching);
    retryBtn.addEventListener("click", startWatching);
  </script>

</body>
</html>
