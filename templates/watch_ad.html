
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly Earn - Watch Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0e14] text-white min-h-screen p-4">

  <div class="max-w-md mx-auto">

    <div class="flex justify-between items-center mb-4">
      <a href="/dashboard"
         class="bg-slate-800 rounded-full px-4 py-2">
        ✕ Back
      </a>

      <div id="countdown-badge"
           class="bg-purple-600/20 border border-purple-500/40
                  text-purple-300 px-4 py-2 rounded-full font-bold">
        00:30
      </div>
    </div>

    <div class="bg-[#151922] border border-slate-800
                rounded-2xl p-4 text-center">

      <h2 id="status-heading" class="text-xl font-bold mb-2">
        Watch Advertisement
      </h2>

      <p id="status-text" class="text-sm text-slate-400 mb-4">
        Your countdown starts below.
      </p>

      <!-- Countdown displayed above the ad -->
      <div class="sticky top-0 z-10 bg-[#151922] py-3">
        <div class="flex justify-between text-sm mb-2">
          <span>Time remaining</span>
          <span id="countdown" class="text-amber-400 font-bold">
            30 seconds
          </span>
        </div>

        <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
          <div id="progress"
               class="bg-purple-500 h-3 rounded-full"
               style="width:100%">
          </div>
        </div>
      </div>

      <!-- Embedded ad attempt -->
      <div class="mt-4 rounded-xl overflow-hidden
                  border border-slate-700 bg-black">

        <iframe
          id="ad-frame"
          src="https://uplcm.com/4/12063392"
          title="Advertisement"
          class="w-full"
          style="height:500px;border:0"
          allow="autoplay"
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

      </div>

      <div id="finished" class="hidden mt-5">
        <p class="text-emerald-400 font-bold">
          Countdown finished.
        </p>
        <p class="text-sm text-slate-400 mt-1">
          Processing your reward...
        </p>
      </div>

      <form id="claim-form" action="/claim-reward"
            method="POST" class="hidden">
      </form>

    </div>

    <p class="text-center text-xs text-slate-600 mt-5">
      Poly Earn &copy; 2026
    </p>

  </div>

  <script>
    let timeLeft = 30;

    const countdown = document.getElementById("countdown");
    const badge = document.getElementById("countdown-badge");
    const progress = document.getElementById("progress");

    const timer = setInterval(function () {
      timeLeft = Math.max(0, timeLeft - 1);

      countdown.textContent = timeLeft + " seconds";
      badge.textContent =
        "00:" + String(timeLeft).padStart(2, "0");

      progress.style.width = (timeLeft / 30 * 100) + "%";

      if (timeLeft === 0) {
        clearInterval(timer);

        document.getElementById("finished").classList.remove("hidden");
        document.getElementById("status-heading").textContent =
          "Countdown Finished";

        document.getElementById("status-text").textContent =
          "Processing your reward.";

        setTimeout(function () {
          document.getElementById("claim-form").submit();
        }, 500);
      }
    }, 1000);
  </script>

</body>
</html>
