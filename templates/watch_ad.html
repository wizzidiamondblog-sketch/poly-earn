
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly Earn - Watch Ad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0e14] text-white min-h-screen flex items-center justify-center p-5">

  <main class="w-full max-w-lg rounded-3xl border border-slate-800 bg-[#151922] p-6 text-center">
    <div class="text-6xl mb-5">⚡</div>

    <h1 class="text-2xl font-bold mb-3">Watch Advertisement</h1>

    <p class="text-slate-400 mb-6">
      Keep this page open while the countdown runs.
    </p>

    <div id="timer"
      class="inline-block rounded-full bg-purple-950 border border-purple-600 px-8 py-4 text-2xl font-bold text-purple-300 mb-6">
      00:30
    </div>

    <p id="status" class="text-slate-300 mb-5">
      Opening advertisement and starting timer...
    </p>

    <p id="error" class="hidden text-red-400 mb-5"></p>

    <button id="retry"
      class="hidden w-full rounded-xl bg-purple-600 py-4 font-bold text-white">
      Try Again
    </button>

    <p class="text-xs text-slate-500 mt-6">
      Reward: 3 Poly Points after a successful, verified claim.
    </p>
  </main>

  <script>
    const AD_URL = "https://uplcm.com/4/12063392";

    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const retryBtn = document.getElementById("retry");

    let started = false;
    let countdownInterval = null;

    function showError(message) {
      clearInterval(countdownInterval);
      timerEl.textContent = "00:30";
      statusEl.textContent = "Could not start the reward session.";
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");
      retryBtn.classList.remove("hidden");
    }

    async function startWatching() {
      if (started) return;
      started = true;

      retryBtn.classList.add("hidden");
      errorEl.classList.add("hidden");
      statusEl.textContent = "Opening advertisement...";

      // Request server authorization first.
      // Open the ad immediately after authorization succeeds.
      try {
        const response = await fetch("/start-ad", {
          method: "POST",
          headers: { "Accept": "application/json" },
          credentials: "same-origin"
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.message || "Server could not authorize this session.");
        }

        // The user clicks Watch Ad to reach this page.
        // Some mobile browsers may block a delayed new tab.
        const adWindow = window.open(AD_URL, "_blank");

        if (!adWindow) {
          started = false;
          showError("Your browser blocked the advert. Allow pop-ups and tap Try Again.");
          return;
        }

        let remaining = 30;
        timerEl.textContent = "00:30";
        statusEl.textContent = "Advertisement opened. Please wait...";

        countdownInterval = setInterval(() => {
          remaining--;
          timerEl.textContent = "00:" + String(remaining).padStart(2, "0");

          if (remaining <= 0) {
            clearInterval(countdownInterval);
            statusEl.textContent = "Time complete. Claiming your reward...";

            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/claim-reward";
            document.body.appendChild(form);
            form.submit();
          }
        }, 1000);

      } catch (error) {
        started = false;
        showError(error.message || "Unable to start. Please try again.");
      }
    }

    retryBtn.addEventListener("click", startWatching);

    // Start automatically when the page loads.
    startWatching();
  </script>

</body>
</html>
