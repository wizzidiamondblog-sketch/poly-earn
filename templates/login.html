
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poly Earn - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">

    <div class="text-center space-y-2 mb-6">
      <h1 class="text-3xl font-extrabold text-indigo-500 tracking-wide">Poly Earn</h1>
      <p class="text-sm text-slate-400">Sign in to your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 p-3 rounded-xl text-center text-sm font-semibold border {% if category == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-400{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-400{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 tracking-wider uppercase">Email Address</label>
        <input type="email" name="email" placeholder="Enter your email" required class="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-all">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1 tracking-wider uppercase">Password</label>
        <input type="password" name="password" placeholder="Enter password" required class="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-all">

        <div class="text-right mt-3">
          <a href="/reset-password" class="text-indigo-400 text-sm font-semibold hover:underline">
            Forgot Password?
          </a>
        </div>
      </div>

      <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl text-white transition-all shadow-lg shadow-indigo-600/30 mt-2">
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      Don't have an account?
      <a href="/register" class="text-indigo-400 font-semibold hover:underline">Register here</a>
    </div>

  </div>

</body>
</html>
