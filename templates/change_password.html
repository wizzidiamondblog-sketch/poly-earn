<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Poly Earn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#0b0e14] text-white flex items-center justify-center p-5">
  <main class="w-full max-w-md rounded-2xl border border-emerald-900 bg-[#111820] p-6 shadow-xl">
    <div class="mb-6 text-center">
      <h1 class="text-3xl font-bold text-emerald-400">Poly Earn</h1>
      <h2 class="mt-4 text-xl font-semibold">Change Password</h2>
      <p class="mt-2 text-sm text-gray-400">
        Update your password securely.
      </p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="mb-4 rounded-lg bg-emerald-950 p-3 text-sm text-emerald-300">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('change_password') }}" class="space-y-4">
      <div>
        <label for="current_password" class="mb-2 block text-sm text-gray-300">Current password</label>
        <input type="password" id="current_password" name="current_password" required autocomplete="current-password"
          class="w-full rounded-xl border border-gray-700 bg-[#0b0e14] p-3 text-white outline-none focus:border-emerald-500">
      </div>

      <div>
        <label for="new_password" class="mb-2 block text-sm text-gray-300">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password"
          class="w-full rounded-xl border border-gray-700 bg-[#0b0e14] p-3 text-white outline-none focus:border-emerald-500">
      </div>

      <div>
        <label for="confirm_password" class="mb-2 block text-sm text-gray-300">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password"
          class="w-full rounded-xl border border-gray-700 bg-[#0b0e14] p-3 text-white outline-none focus:border-emerald-500">
      </div>

      <button type="submit" class="w-full rounded-xl bg-emerald-500 p-3 font-semibold text-black hover:bg-emerald-400">
        Update Password
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-400">
      <a href="{{ url_for('dashboard') }}" class="text-emerald-400 hover:underline">Back to Dashboard</a>
    </p>
  </main>
</body>
</html>
