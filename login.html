<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poly Earn - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-extrabold text-emerald-400">⚡ Poly Earn</h1>
            <p class="text-xs text-gray-400">Watch ads, invite friends, and earn Polygon USDT!</p>
        </div>
        <form method="POST" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-gray-300 block mb-1">Username</label>
                <input type="text" name="username" required placeholder="Enter your username" class="w-full bg-slate-950 text-xs text-gray-200 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <div>
                <label class="text-xs font-bold text-gray-300 block mb-1">Password</label>
                <input type="password" name="password" required placeholder="Enter password" class="w-full bg-slate-950 text-xs text-gray-200 border border-slate-800 rounded-xl px-4 py-3.5 focus:outline-none focus:border-emerald-500 transition">
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]">
                Login / Register
            </button>
        </form>
    </div>
</body>
</html>
